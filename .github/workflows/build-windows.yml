name: "Build Windows (QLPhongMay)"
on:
  workflow_dispatch:

# Build bản Windows bằng MSYS2/MinGW-w64 ngay trên runner Windows của GitHub
# (image mingw của Veyon nằm trên GitLab riêng nên không dùng được từ đây).
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-zlib
      - name: Biên dịch QCA (Qt6) từ mã nguồn
        run: |
          git clone --depth 1 --branch v2.3.10 https://github.com/KDE/qca.git /tmp/qca
          cmake -G Ninja -S /tmp/qca -B /tmp/qca-build -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF -DBUILD_PLUGINS=ossl -DCMAKE_INSTALL_PREFIX=/mingw64
          cmake --build /tmp/qca-build
          cmake --install /tmp/qca-build
      - name: Biên dịch thư viện Interception (khóa bàn phím/chuột)
        run: |
          git clone --depth 1 https://github.com/oblitum/Interception.git /tmp/interception
          cd /tmp/interception/library
          gcc -shared -O2 -DINTERCEPTION_EXPORT -o interception.dll interception.c -Wl,--out-implib,libinterception.dll.a
          cp interception.h /mingw64/include/
          cp interception.dll /mingw64/bin/
          cp libinterception.dll.a /mingw64/lib/
      - name: Cấu hình
        run: |
          git config --global --add safe.directory '*'
          .ci/common/strip-ultravnc-sources.sh
          cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Release -DWITH_WEBAPI=OFF -DWITH_LDAP=OFF -DWITH_BUNDLED_LIBVNC=ON -DWITH_LTO=OFF -DWITH_TESTS=OFF -DWITH_WERROR=OFF -DWITH_TRANSLATIONS_UPDATE=OFF \
            -DCMAKE_C_FLAGS=-Wno-error=incompatible-pointer-types
      - name: Biên dịch
        run: cmake --build build -- -k 0
      - name: Gom file
        run: |
          D=QLPhongMay-win64
          mkdir -p $D/plugins $D/translations
          cp build/core/veyon-core.dll $D/
          find build -mindepth 2 -name 'veyon-*.exe' -exec cp '{}' $D/ \;
          find build/plugins -name '*.dll' -exec cp '{}' $D/plugins/ \;
          cp build/translations/*.qm $D/translations/ || true
          # kéo theo mọi DLL phụ thuộc nằm trong /mingw64
          for f in $D/*.exe $D/*.dll $D/plugins/*.dll; do
            ldd "$f" | awk '/mingw64/ {print $3}'
          done | sort -u | while read -r dll; do cp -n "$dll" $D/; done
          # plugin Qt cần thiết
          for p in platforms/qwindows.dll styles/qmodernwindowsstyle.dll imageformats/qjpeg.dll; do
            mkdir -p $D/$(dirname $p); cp /mingw64/share/qt6/plugins/$p $D/$p || cp /mingw64/lib/qt6/plugins/$p $D/$p
          done
          # plugin mật mã của QCA (bắt buộc cho xác thực bằng khóa)
          mkdir -p $D/crypto
          find /mingw64 -name 'libqca-ossl*.dll' -exec cp '{}' $D/crypto/ \;
          # trình điều khiển khóa bàn phím/chuột và engine chụp màn hình đi kèm trong repo
          mkdir -p $D/interception
          cp 3rdparty/interception/* $D/interception/
          cp 3rdparty/ddengine/ddengine64.dll $D/
          cat > $D/HUONG-DAN.txt <<'TXT'
QLPhongMay (Veyon Việt hóa + nhận diện số máy) - bản Windows 64-bit, chạy trực tiếp từ thư mục này.

MÁY GIÁO VIÊN
  1. Chạy veyon-configurator.exe (chuột phải > Run as administrator).
  2. Mục Xác thực: tạo cặp khóa (ví dụ tên "teacher"), xuất khóa công khai.
  3. Mục Danh bạ: thêm phòng và nhập danh sách IP các máy (có thể nhập CSV).
  4. Chạy veyon-master.exe để giám sát. Tính năng "Nhận diện số máy" nằm trên thanh công cụ.

MÁY HỌC SINH
  1. Chép nguyên thư mục này sang máy học sinh.
  2. Chạy veyon-configurator.exe (Run as administrator), nhập khóa công khai của giáo viên (mục Xác thực), rồi
     ở mục Dịch vụ bấm "Đăng ký dịch vụ Veyon" và "Khởi động dịch vụ".
  3. Cho phép cổng 11100 trong tường lửa nếu được hỏi.

Chạy bằng dòng lệnh: veyon-cli.exe help
TXT
          ls -R $D | head -100
          zip -r $D.zip $D
      - uses: actions/upload-artifact@v4
        with:
          name: QLPhongMay-windows-x64
          path: QLPhongMay-win64.zip
