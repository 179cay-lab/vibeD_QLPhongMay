[package]
name = "qlpm-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qlpm-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "net"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
xcap = "0.0.14"
