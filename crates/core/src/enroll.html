<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng ký số máy</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
main{text-align:center;padding:32px;max-width:520px}
h1{font-size:34px;margin:0 0 8px}p{color:#94a3b8;font-size:18px}
input{font-size:64px;width:220px;text-align:center;padding:12px;border-radius:14px;border:3px solid #2563eb;background:#fff;color:#0f172a}
button{display:block;margin:24px auto 0;font-size:28px;padding:16px 48px;border:0;border-radius:14px;background:#2563eb;color:#fff;cursor:pointer}
button:disabled{opacity:.5}#msg{margin-top:20px;font-size:22px;min-height:30px}.ok{color:#4ade80}.err{color:#f87171}
</style></head><body><main>
<h1>Bạn là máy số mấy?</h1>
<p>Nhập số ghi trên máy của bạn rồi bấm nút.</p>
<input id="n" type="number" min="1" inputmode="numeric" autofocus>
<button id="b">Tôi là máy này</button>
<div id="msg"></div>
</main><script>
const n=document.getElementById('n'),b=document.getElementById('b'),m=document.getElementById('msg');
async function go(){
  const v=parseInt(n.value,10); if(!(v>=1)){m.className='err';m.textContent='Hãy nhập số máy.';return}
  b.disabled=true;m.className='';m.textContent='Đang gửi…';
  try{const r=await fetch('/enroll',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({number:v})});
    const j=await r.json();m.className=j.ok?'ok':'err';m.textContent=j.message;
    if(j.ok){n.disabled=true;return}}
  catch(e){m.className='err';m.textContent='Không kết nối được máy giáo viên.'}
  b.disabled=false}
b.onclick=go;n.onkeydown=e=>{if(e.key==='Enter')go()};
</script></body></html>
